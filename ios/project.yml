name: DecisionPacman
options:
  bundleIdPrefix: io.github.grapeot
  deploymentTarget:
    iOS: "17.0"
targets:
  DecisionPacman:
    type: application
    platform: iOS
    sources:
      - path: DecisionPacman
        excludes: [Web]
      - path: DecisionPacman/Web
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/build-apple/llama.xcframework
        embed: true
    info:
      path: DecisionPacman/Info.plist
      properties:
        CFBundleDisplayName: Pac-Man Local
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [decisionpacman]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.grapeot.decisionpacman
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
